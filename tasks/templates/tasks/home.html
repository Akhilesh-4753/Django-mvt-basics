{% extends "base.html" %}

{% block title %}My Tasks{% endblock %}

{% block content %} 
<main class="container py-5">
    <div class="row justify-content-center">
        <section class="col-12 col-md-8 col-lg-6">
            <h1 class="mb-4">My tasks</h1>

            {% if is_student %}
            <div class="alert alert-info" role="status">Keep practicing</div>
            {% endif %}

            {% if tasks %}
            <ul class="list-group">
                {% for task in tasks %}
                <li class="list-group-item mt-3">{{ task }}</li>
                {% endfor %}
            </ul>
            {% else %}
            <p class="text-body-secondary">No tasks yet.</p>
            {% endif %}
        </section>
    </div>
</main>
{% endblock %}
